<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Account Statement Generator</title>

  <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.3.1/css/bootstrap.min.css}" />
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/5.9.0/css/all.min.css}" />
  <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon" />

<!-- FontAwesome -->
<link rel="stylesheet"
	th:href="@{/webjars/font-awesome/5.9.0/css/all.min.css}" />

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: Verdana, Geneva, Tahoma, sans-serif;
}

body {
	display: flex;
	justify-content: center;
	align-items: center;
	min-height: 100vh;
	overflow: auto;
	background-image: url("images/finance-money.jpg");
	background-size: cover;
	background-position: center;
	background-repeat: no-repeat;
}

.logincontainer {
	position: relative;
	width: 800px;
	height: 400px;
	display: flex;
	border-radius: 10px;
	overflow: hidden;
	background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%,
		rgba(173, 216, 230, 0.5) 100%);
	box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
}

/* Left Panel: Login Form */
.logincontainer .form-box.login {
	width: 50%;
	background: rgba(0, 72, 129, 0.85);
	color: #fff;
	display: flex;
	flex-direction: column;
	justify-content: center;
	padding: 40px;
}

.form-box h2 {
	font-size: 32px;
	text-align: center;
	margin-bottom: 30px;
}

.input-box {
	position: relative;
	width: 100%;
	height: 50px;
	margin: 20px 0;
}

.input-box input {
	width: 100%;
	height: 100%;
	background: transparent;
	border: none;
	outline: none;
	border-bottom: 2px solid #ffc107;
	padding: 10px;
	font-size: 16px;
	color: #fff;
}

.input-box label {
	position: absolute;
	top: 50%;
	left: 0;
	transform: translateY(-50%);
	pointer-events: none;
	font-size: 16px;
	color: #ffc107;
	transition: 0.5s;
}

.input-box input:focus ~label, .input-box input:valid ~label {
	top: -10px;
	font-size: 12px;
	color: #fff;
}

.input-box i {
	position: absolute;
	top: 50%;
	right: 0;
	transform: translateY(-50%);
	font-size: 18px;
	color: #ffc107;
}

.btn {
	width: 100%;
	height: 45px;
	background: #ffc107;
	border: none;
	border-radius: 40px;
	cursor: pointer;
	font-size: 16px;
	font-weight: 600;
	color: #004481;
	margin-top: 20px;
	transition: 0.3s;
}

.btn:hover {
	background: #e6b800;
}

.form-box .log-detail {
	font-size: 14px;
	color: #fff;
	text-align: center;
	margin-top: 15px;
}

.form-box .feedback-msg {
	font-size: 14px;
	margin-top: 10px;
	text-align: center;
	color: #ff4d4d;
}

.form-box .feedback-msg span[style] {
	color: #006600;
}

/* Right Panel: Logo + Welcome */
.logincontainer .right-panel {
	width: 50%;
	background: rgba(255, 255, 255, 0.85);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	padding: 20px;
	text-align: center;
}

.right-panel img {
	width: 120px;
	margin-bottom: 20px;
}

.right-panel h2 {
	font-size: 28px;
	color: #004481;
	margin-bottom: 10px;
}

.right-panel p {
	font-size: 16px;
	color: #333;
}

.overlay {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background: rgba(0, 0, 0, 0.5);
	z-index: -1;
}

@media ( max-width : 900px) {
	.logincontainer {
		flex-direction: column;
		width: 90%;
		height: auto;
	}
	.logincontainer .form-box.login, .logincontainer .right-panel {
		width: 100%;
		padding: 30px;
	}
	.form-box h2 {
		font-size: 28px;
	}
	.right-panel h2 {
		font-size: 24px;
	}
}

.otp-box {
	display: flex;
	justify-content: space-between;
	gap: 5px;
	margin-bottom: 15px;
}

.otp-box input {
	width: 48px;
	height: 50px;
	font-size: 20px;
	text-align: center;
	border-radius: 5px;
	border: 1px solid #ccc;
	transition: border-color 0.3s;
}

.otp-box input:focus {
	border-color: rgb(104, 145, 162);
	outline: none;
}

.timer {
	text-align: center;
	font-weight: bold;
	margin-bottom: 10px;
	color: #444;
}
</style>
</head>

<body>
	<div class="overlay"></div>

	<div class="logincontainer">
		<div class="form-box login">
			<p class="text-center font-weight-bold" style="letter-spacing: 1px;">OTP
				Verification</p>
			<p th:text="'Your OTP (for testing): ' + ${otp}"
				style="text-align: center; color: white;"></p>
			<form th:action="@{/verify-otp}" method="post" class="form-signin"
				onsubmit="combineOTP()">
				<div class="otp-box">
					<input type="text" maxlength="1"
						oninput="this.value=this.value.replace(/[^0-9]/g,'');"
						inputmode="numeric" required /> <input type="text" maxlength="1"
						oninput="this.value=this.value.replace(/[^0-9]/g,'');"
						inputmode="numeric" required /> <input type="text" maxlength="1"
						oninput="this.value=this.value.replace(/[^0-9]/g,'');"
						inputmode="numeric" required /> <input type="text" maxlength="1"
						oninput="this.value=this.value.replace(/[^0-9]/g,'');"
						inputmode="numeric" required /> <input type="text" maxlength="1"
						oninput="this.value=this.value.replace(/[^0-9]/g,'');"
						inputmode="numeric" required /> <input type="text" maxlength="1"
						oninput="this.value=this.value.replace(/[^0-9]/g,'');"
						inputmode="numeric" required />
				</div>

				<input type="hidden" name="otp" id="otpHidden" />

				<div class="timer">
					Time remaining: <span id="countdown">120</span>s
				</div>

				<div class="alert-msg">
					<span th:if="${param.error}" style="color: #cd103c;">Invalid
						OTP. Please try again.</span> <span th:if="${param.success}"
						style="color: green;">OTP Verified Successfully.</span>
				</div>

				<button type="submit" class="btn btn-block btn-primary btn-signin">
					<i class='fas fa-key'></i>
				</button>
			</form>
		</div>

		<!-- Right Side: Client Logo + Welcome -->
		<div class="right-panel">
			<img th:src="@{/images/Bornfire.png}" alt="Bornfire">
			<h2>Welcome to</h2>
			<h2>Account Statement Generator</h2>
		</div>
	</div>

	<script th:src="@{/webjars/jquery/3.4.1/jquery.js}"></script>
	<script>
    // Redirect on F5 or Back/Forward cache restore
    if (performance.navigation.type === 1) {
      window.location.href = "/AccountStatement/login";
    }
    window.addEventListener("pageshow", function (event) {
      if (event.persisted) {
        window.location.href = "/AccountStatement/login";
      }
    });

    // Timer
    let timer = 120;
    const countdownElement = document.getElementById("countdown");
    const interval = setInterval(() => {
      timer--;
      countdownElement.textContent = timer;
      if (timer <= 0) {
        clearInterval(interval);
        window.location.href = "/AccountStatement/login";
      }
    }, 1000);

    // Auto-move to next input
    document.querySelectorAll('.otp-box input').forEach((input, index, inputs) => {
      input.addEventListener('input', function () {
        if (this.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', function (e) {
        if (e.key === "Backspace" && !this.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    // Combine input to hidden field
    function combineOTP() {
      const inputs = document.querySelectorAll('.otp-box input');
      let otp = "";
      inputs.forEach(input => otp += input.value);
      document.getElementById("otpHidden").value = otp;
    }
  </script>

</body>

</html>
