<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>BRF Reports</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<link rel="shortcut icon" href="assets/images/favicon.ico">
<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" type="text/css">
<link th:href="@{/css/icons.min.css}" rel="stylesheet" type="text/css">
<link th:href="@{/css/app.min.css}" rel="stylesheet" type="text/css">
<link th:href="@{/css/materialdesignicons.min.css}" rel="stylesheet" type="text/css">
<link th:href="@{/css/bhms-modern.css}" rel="stylesheet" type="text/css">	
<script src="/webjars/jquery/3.4.1/jquery.min.js"
    th:src="@{/webjars/jquery/3.4.1/jquery.min.js}"></script>

<script src="/webjars/popper.js/1.14.7/umd/popper.min.js"
    th:src="@{/webjars/popper.js/1.14.7/umd/popper.min.js}"></script>

<script src="/webjars/bootstrap/4.3.1/js/bootstrap.min.js"
    th:src="@{/webjars/bootstrap/4.3.1/js/bootstrap.min.js}"></script>

<script src="/webjars/jquery-ui/1.12.1/jquery-ui.min.js"
    th:src="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.js}"></script>

<script src="/webjars/jquery-form/4.2.2/jquery.form.min.js"
    th:src="@{/webjars/jquery-form/4.2.2/jquery.form.min.js}"></script>

<script src="/webjars/jquery-validation/1.19.0/jquery.validate.min.js"
    th:src="@{/webjars/jquery-validation/1.19.0/jquery.validate.min.js}"></script>
<style>
/* ── ROOT COLOUR TOKENS (match AccountStatementHeader palette) ── */
:root {
    --brand-dark:   #1a1d35;
    --brand-purple: #6c63ff;
    --brand-blue:   #0b1c54;
    --bg-page:      #f0f2f5;
    --bg-card:      #ffffff;
    --border-light: #e8ecf4;
    --text-main:    #1a1b2e;
    --text-muted:   #7b8299;
    --th-bg:        rgba(108, 99, 255, 0.10);   /* transparent blue header */
    --th-color:     #3b3585;
    --th-border:    rgba(108, 99, 255, 0.22);
    --row-hover:    rgba(108, 99, 255, 0.04);
    --status-green-bg: #e6f9f0;
    --status-green-fg: #1a8a5a;
    --status-red-bg:   #fff0f0;
    --status-red-fg:   #c0392b;
}

/* ── GLOBAL ── */
*, *::before, *::after { box-sizing: border-box; }
body {
    background: var(--bg-page);
    font-family: 'Segoe UI', 'Inter', sans-serif;
    margin: 0;
}

/* ── MAIN WRAPPER (leaves room for the fixed sidebar) ── */
.main-wrapper {
    margin-left: 65px;
    width: calc(100% - 65px);
    min-height: 100vh;
    transition: margin-left 0.3s, width 0.3s;
}
.main-wrapper.expanded {
    margin-left: 240px;
    width: calc(100% - 240px);
}

/* ── PAGE CONTAINER ── */
.page-container { padding: 28px 28px 40px; }

/* ══════════════════════════════════════════
   UNIFIED CARD  — header + table in one box
   ══════════════════════════════════════════ */
.report-card {
    background: var(--bg-card);
    border-radius: 20px;
    box-shadow: 0 2px 16px rgba(26, 29, 53, 0.08);
    overflow: visible;
}

/* ── CARD HEADER STRIP ── */
.card-header-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    padding: 20px 24px 18px;
    border-bottom: 1px solid var(--border-light);
}

/* Left: icon + title + breadcrumb */
.card-title-group {
    display: flex;
    align-items: center;
    gap: 14px;
}
.card-icon {
    width: 46px;
    height: 46px;
    background: linear-gradient(135deg, var(--brand-purple), #8b83ff);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(108,99,255,0.28);
}
.card-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--brand-blue);
    margin: 0;
    line-height: 1.2;
}

/* Right: date picker + filter button */
.card-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

/* Date picker pill  */
.date-picker-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #f8f7ff 0%, #f0eeff 100%);
    border: 1.5px solid #e4e0ff;
    border-radius: 14px;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.25s;
}
.date-picker-pill:hover,
.date-picker-pill:focus-within {
    border-color: var(--brand-purple);
    box-shadow: 0 4px 16px rgba(108,99,255,0.15);
}
.date-picker-pill .dp-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--brand-purple), #8b83ff);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 14px;
    flex-shrink: 0;
}
.date-picker-pill label {
    font-size: 10px;
    font-weight: 700;
    color: var(--brand-purple);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    display: block;
    margin: 0;
    line-height: 1;
    cursor: pointer;
}
.date-picker-pill input[type="date"] {
    border: none;
    background: transparent;
    outline: none;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-main);
    cursor: pointer;
    padding: 0;
    min-width: 120px;
}

/* Check-date button */
.check-btn {
    height: 48px;
    padding: 0 20px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--brand-purple), #8b83ff);
    color: white;
    font-weight: 600;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(108,99,255,0.28);
}
.check-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(108,99,255,0.38);
}

/* Filter button */
.filter-btn {
    height: 48px;
    padding: 0 18px;
    border: 1.5px solid #dce4f2;
    border-radius: 14px;
    background: #f0f4fc;
    color: var(--brand-blue);
    font-weight: 600;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.2s;
}
.filter-btn:hover, .filter-btn.active {
    background: #e2ecf9;
    border-color: #bcd1ee;
}
.filter-btn.active { color: var(--brand-purple); border-color: var(--brand-purple); }

/* Result count badge */
.result-badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    background: #f3f4f8;
    border-radius: 20px;
    padding: 4px 12px;
    white-space: nowrap;
}

/* ══════════════════════════
   TABLE
   ══════════════════════════ */
.table-responsive { overflow-x: auto; }

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
}

/* ── THEAD — transparent blue (matching header brand) ── */
table thead th {
    background: #f8fafc;
    /* color: var(--th-color) !important; */
    font-weight: 700;
    font-size: 12px !important;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 9px 16px !important;
    border-bottom: 1px solid var(--th-border) !important;
    border-top: none !important;
    white-space: nowrap;
    position: relative;
}
table thead tr:first-child th:first-child { border-radius: 0; }
table thead tr:first-child th:last-child  { border-radius: 0; }

/* ── TBODY ── */
table tbody tr {
    transition: background 0.15s;
}
table tbody tr:hover {
    background: var(--row-hover);
}
table td {
    padding: 7px 16px;
    border-bottom: 1px solid #f0f2f6;
    font-size: 13px;
    color: var(--text-main);
    vertical-align: middle;
}
table tbody tr:last-child td { border-bottom: none; }

/* RPT code link style */
td.reportcode.underline {
    color: var(--brand-purple);
    text-decoration: underline;
    cursor: pointer;
    font-weight: 600;
}

/* ── STATUS PILLS ── */
.status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 13px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
}
.status-pill.enabled  { background: var(--status-green-bg); color: var(--status-green-fg); }
.status-pill.disabled { background: var(--status-red-bg);   color: var(--status-red-fg); }
.status-pill.loading  { 
	background: #f3f4f8;
	color: var(--text-muted);
	padding: 4px 9px;      /* Reduced padding from 5px 13px */
    font-size: 12px;       /* Slightly smaller text */
	}
	
.status-pill.loading .fa-spin {
   font-size: 10px;       /* Makes the loading icon itself smaller */
}
.status-pill.error    { background: #fff5e6; color: #c87f0a; }

/* ── ACTION BUTTON ── */
.run-btn {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    border: none;
    background: linear-gradient(135deg, var(--brand-purple), #8b83ff);
    color: white;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(108,99,255,0.28);
    transition: all 0.2s;
}
.run-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(108,99,255,0.38);
}

/* ── th-content flex ── */
.th-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

/* ── FILTER ICON ── */
.filter-icon {
    display: none !important;
    cursor: pointer;
    color: var(--th-color);
    padding: 3px 5px;
    border-radius: 4px;
    font-size: 11px;
    transition: background 0.15s;
}
.filter-icon:hover { background: rgba(108,99,255,0.15); }
.filter-icon.has-filter { color: var(--brand-purple) !important; }

/* ── COLUMN FILTER DROPDOWN ── */
.filter-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: white;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(26,29,53,0.14);
    padding: 10px;
    z-index: 1000;
    text-transform: none;
    font-weight: normal;
    min-width: 200px;
    max-height: 290px;
}
.dropdown-search-wrapper { position: relative; margin-bottom: 8px; }
.dropdown-search-wrapper input {
    width: 100%;
    height: 30px;
    font-size: 12px;
    padding: 4px 8px 4px 26px;
    border: 1px solid var(--border-light);
    border-radius: 6px;
    outline: none;
}
.dropdown-search-wrapper i { position: absolute; left: 9px; top: 9px; font-size: 11px; color: #aaa; }
.filter-dropdown label {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 5px; font-size: 12px; cursor: pointer; color: #444; white-space: nowrap;
}
.filter-dropdown-buttons {
    display: flex; justify-content: space-between;
    margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee;
}
.filter-dropdown-buttons button {
    font-size: 11px; padding: 4px 10px; border-radius: 5px;
    border: 1px solid #ddd; background: #f8f9fa; cursor: pointer;
}
.filter-dropdown-buttons .apply-btn {
    background: var(--brand-purple); color: white; border-color: var(--brand-purple);
}
.clear-btn:hover { background: #e9ecef; }

/* ── EMPTY STATE ── */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
}
.empty-state i { font-size: 42px; margin-bottom: 14px; color: #cdd0de; display: block; }
.empty-state p { font-size: 14px; margin: 0; }

/* ── LOADER MODAL ── */
#loader1.modal .modal-content {
    border-radius: 16px;
    border: none;
    box-shadow: 0 8px 32px rgba(26,29,53,0.18);
    text-align: center;
    padding: 36px 28px;
}
#loader1.modal .modal-body { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.loader-spinner {
    width: 52px; height: 52px;
    border: 4px solid #e8e4ff;
    border-top-color: var(--brand-purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── RESPONSIVE ── */
@media (max-width: 991px) {
    .card-header-strip { flex-direction: column; align-items: flex-start; }
    .card-controls { width: 100%; }
    .date-picker-pill { flex: 1; }
}
</style>
</head>

<body>

<!-- Sidebar injected from fragment -->
	<div th:insert="AccountStatementHeader :: header"></div>

<div class="main-wrapper" id="mainWrapper">
<div class="page-container">

    <!-- ══ UNIFIED CARD (header + table merged) ══ -->
    <div class="report-card">

        <!-- ── Card Header ── -->
        <div class="card-header-strip">

            <!-- Left: icon + title -->
            <div class="card-title-group">
                <div class="card-icon"><i class="fa fa-bar-chart"></i></div>
                <div>
                    <p class="card-title" th:text="${menu != null ? menu : 'BRF Reports'}">Monthly 1 - BRF Report</p>
                </div>
            </div>

            <!-- Right: date picker + check + filter -->
            <div class="card-controls">

                <!-- Date picker -->
                <form method="POST" th:action="@{/monthly1}" style="margin:0;display:flex;align-items:center;gap:10px;">
                    <div class="date-picker-pill">
                        <div class="dp-icon"><i class="fa fa-calendar"></i></div>
                        <div>
                            <label for="dateinput">Report Date</label>
                            <input type="date" id="dateinput" name="report_date"
                                   th:value="${reportDate != null ? #dates.format(reportDate,'yyyy-MM-dd') : ''}"
                                   onchange="this.form.submit(); checkdate();">
                        </div>
                    </div>
                    <button type="submit" class="check-btn">
                        <i class="fa fa-search"></i> Check Status
                    </button>
                </form>

                <!-- Filter toggle -->
                <button type="button" id="mainFilterBtn" class="filter-btn" onclick="toggleFilters()">
                    <i class="fa fa-filter"></i> Filter
                </button>

            </div>
        </div>

        <!-- ── Table ── -->
        <div class="table-responsive">
            <table id="customerTable">
                <thead>
                    <tr>
                        <th style="position:relative;">
                            <div class="th-content">Report Code
                                <i class="fa fa-filter filter-icon" onclick="toggleDropdown(event,0)"></i>
                                <div class="filter-dropdown"></div>
                            </div>
                        </th>
                        <th style="position:relative;">
                            <div class="th-content">Report Name
                                <i class="fa fa-filter filter-icon" onclick="toggleDropdown(event,1)"></i>
                                <div class="filter-dropdown"></div>
                            </div>
                        </th>
                        <th style="position:relative;">
                            <div class="th-content">Start Date
                                <i class="fa fa-filter filter-icon" onclick="toggleDropdown(event,2)"></i>
                                <div class="filter-dropdown"></div>
                            </div>
                        </th>
                        <th style="position:relative;">
                            <div class="th-content">End Date
                                <i class="fa fa-filter filter-icon" onclick="toggleDropdown(event,3)"></i>
                                <div class="filter-dropdown"></div>
                            </div>
                        </th>
                       <th style="position:relative; text-align: center;">
					    <div class="th-content" style="justify-content: center;">Status
					        <i class="fa fa-filter filter-icon" onclick="toggleDropdown(event,4)"></i>
					        <div class="filter-dropdown"></div>
					    </div>
					</th>
					<th style="text-align: center;">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- No data row -->
                    <tr th:if="${COUNT} == '0'">
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="fa fa-inbox"></i>
                                <p>No data found for the selected date.</p>
                            </div>
                        </td>
                    </tr>

                    <!-- Data rows -->
                    <tr th:each="userProfile : ${reportlist}"
                        th:attr="data-cust_id=${userProfile.srl_no}"
                        th:id="${userProfile.srl_no}"
                        class="userlist">

                        <td class="reportcode underline"
                            th:attr="data-rptcode=${userProfile.rpt_code},
                                     data-fromdate=${#dates.format(userProfile.start_date,'dd/MM/yyyy')},
                                     data-todate=${#dates.format(userProfile.end_date,'dd/MM/yyyy')}"
                            onclick="getVali(this)"
                            th:text="${userProfile.rpt_code}">
                        </td>

                        <td th:text="${userProfile.rpt_description}"></td>
                        <td th:text="${#dates.format(userProfile.start_date,'dd/MM/yyyy')}"></td>
                        <td th:text="${#dates.format(userProfile.end_date,'dd/MM/yyyy')}"></td>

                        <!-- Status — populated by checkdate() via fetch -->
                       <td class="rpt-status" style="text-align:center">

						    <span th:if="${userProfile.domain == 'Y'}"
						          class="status-pill enabled">
						        <i class="fa fa-check-circle"></i> Enabled
						    </span>
						
						    <span th:if="${userProfile.domain != 'Y'}"
						          class="status-pill disabled">
						        <i class="fa fa-times-circle"></i> Disabled
						    </span>
						
						</td>

                        <!-- Run action -->
                        <td style="text-align: center;">
					    <button class="run-btn"
					            th:attr="data-srl_no=${userProfile.srl_no}"
					            onclick="executeprocedurePerRow(this)"
					            title="Execute Report">
					        <i class="fa fa-play"></i>
					    </button>
					</td>
                    </tr>
                </tbody>
            </table>
        </div><!-- /table-responsive -->

    </div><!-- /report-card -->

</div><!-- /page-container -->
</div><!-- /main-wrapper -->

<!-- Loader Modal -->
<div class="modal fade" id="loader1" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-body">
                <div class="loader-spinner"></div>
                <div>
                    <p style="font-weight:700;color:#1a1b2e;margin:0;font-size:15px;">Processing Report</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
/* ── Column filter state ── */
var activeFilters = {};

function toggleDropdown(event, colIndex) {
    event.stopPropagation();
    document.querySelectorAll('.filter-dropdown').forEach(div => {
        if (div !== event.target.nextElementSibling) div.style.display = 'none';
    });
    const dropdown = event.target.nextElementSibling;
    if (dropdown.style.display === 'block') { dropdown.style.display = 'none'; return; }

    const rows = document.querySelector('#customerTable tbody').getElementsByTagName('tr');
    let uniqueValues = new Set();
    for (let i = 0; i < rows.length; i++) {
        let td = rows[i].getElementsByTagName('td')[colIndex];
        if (td) uniqueValues.add((td.textContent || td.innerText).trim());
    }

    const isAllChecked = !activeFilters[colIndex] || activeFilters[colIndex].length === uniqueValues.size;
    let html = `<div class="dropdown-search-wrapper" onclick="event.stopPropagation()">
        <i class="fa fa-search"></i>
        <input type="text" placeholder="Search…" onkeyup="filterDropdownList(this)">
    </div>
    <div class="checkbox-container" style="max-height:150px;overflow-y:auto;">
        <label class="dropdown-item-label" style="font-weight:700;border-bottom:1px solid #eee;padding-bottom:6px;margin-bottom:6px;">
            <input type="checkbox" class="select-all-cb" ${isAllChecked ? 'checked' : ''} onchange="toggleSelectAllDropdown(this)">
            <span>(Select All)</span>
        </label>`;
    uniqueValues.forEach(val => {
        const isChecked = !activeFilters[colIndex] || activeFilters[colIndex].includes(val);
        html += `<label><input type="checkbox" class="item-cb" value="${val}" ${isChecked ? 'checked' : ''} data-col="${colIndex}" onchange="handleItemCheckboxChange(this)"><span>${val || '(Blank)'}</span></label>`;
    });
    html += `</div><div class="filter-dropdown-buttons" onclick="event.stopPropagation()">
        <button class="clear-btn" onclick="clearColumnFilter(event,${colIndex})">Reset</button>
        <button class="apply-btn"  onclick="applyColumnFilter(event,${colIndex})">OK</button>
    </div>`;
    dropdown.innerHTML = html;
    dropdown.style.display = 'block';
}

function filterDropdownList(input) {
    const term = input.value.toLowerCase();
    input.closest('.filter-dropdown').querySelectorAll('label:not(.master-select-label)').forEach(lbl => {
        lbl.style.display = lbl.textContent.toLowerCase().includes(term) ? '' : 'none';
    });
}

function toggleSelectAllDropdown(cb) {
    cb.closest('.filter-dropdown').querySelectorAll('.item-cb').forEach(c => c.checked = cb.checked);
}

function handleItemCheckboxChange(cb) {
    const dd = cb.closest('.filter-dropdown');
    const all = dd.querySelectorAll('.item-cb');
    const checked = dd.querySelectorAll('.item-cb:checked');
    dd.querySelector('.select-all-cb').checked = all.length === checked.length;
}

function applyColumnFilter(event, colIndex) {
    event.stopPropagation();
    const dd = event.target.closest('.filter-dropdown');
    const checked = Array.from(dd.querySelectorAll('.item-cb:checked')).map(c => c.value);
    activeFilters[colIndex] = checked;
    const icon = dd.previousElementSibling;
    if (icon) icon.classList.toggle('has-filter', checked.length > 0);
    applyAllFilters();
    dd.style.display = 'none';
}

function clearColumnFilter(event, colIndex) {
    event.stopPropagation();
    delete activeFilters[colIndex];
    const dd = event.target.closest('.filter-dropdown');
    dd.querySelectorAll('.item-cb, .select-all-cb').forEach(c => c.checked = true);
    const icon = dd.previousElementSibling;
    if (icon) icon.classList.remove('has-filter');
    applyAllFilters();
}

function clearAllFilters() {
    activeFilters = {};
    document.querySelectorAll('.filter-icon').forEach(i => i.classList.remove('has-filter'));
    applyAllFilters();
}

function applyAllFilters() {
    const rows = document.querySelectorAll('#customerTable tbody tr.userlist');
    rows.forEach(row => {
        let show = true;
        Object.keys(activeFilters).forEach(col => {
            const td = row.getElementsByTagName('td')[col];
            if (td) {
                const val = (td.textContent || td.innerText).trim();
                if (!activeFilters[col].includes(val)) show = false;
            }
        });
        row.style.display = show ? '' : 'none';
    });
}

function toggleFilters() {
    const btn = document.getElementById('mainFilterBtn');
    btn.classList.toggle('active');
    const active = btn.classList.contains('active');
    document.querySelectorAll('.filter-icon').forEach(icon => {
        icon.style.setProperty('display', active ? 'inline-block' : 'none', 'important');
        if (!active) { const dd = icon.nextElementSibling; if (dd) dd.style.display = 'none'; }
    });
    if (!active) clearAllFilters();
}

/* ── Execute procedure per row ── */
function executeprocedurePerRow(btn) {
    if (!window.location.pathname.includes('monthly1')) {
        alert('Currently only available for Monthly 1');
        return;
    }
    const selectedDate = document.getElementById('dateinput').value;
    if (!selectedDate) { alert('Please select a report date first.'); return; }
    const srl_no = btn.getAttribute('data-srl_no');
    btn.disabled = true;
    const origHTML = btn.innerHTML;
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';
    $('#loader1').modal('show');

    fetch(`./executeProcedure?reportDate=${encodeURIComponent(selectedDate)}&srl_no=${srl_no}`, { method: 'POST' })
        .then(r => { if (!r.ok) throw new Error('Network error'); return r.json(); })
        .then(() => { $('#loader1').modal('hide'); alert('Procedure executed successfully!'); window.location.reload(); })
        .catch(err => { $('#loader1').modal('hide'); console.error(err); alert('Failed to execute procedure. Please try again.'); })
        .finally(() => { btn.disabled = false; btn.innerHTML = origHTML; });
}

function getVali(ele) {

    var reportid = ele.getAttribute("data-rptcode");
    var todate = ele.getAttribute("data-todate");

    $('#loader1').modal('show');

    fetch('./checkDomainFlag?rptcode=' + reportid)
        .then(response => response.text())
        .then(result => {

            $('#loader1').modal('hide');

            if (result === 'ENABLED') {

                window.location.href =
                    './BRFValidations?rptcode=' +
                    encodeURIComponent(reportid) +
                    '&todate=' +
                    encodeURIComponent(todate);

            } else if (result === 'DISABLED') {

                alert('This report is disabled.');

            } else {

                alert('Report not found.');
            }
        })
        .catch(error => {

            console.error('Error checking domain flag:', error);

            $('#loader1').modal('hide');

            alert('An error occurred while checking report status.');
        });
}
